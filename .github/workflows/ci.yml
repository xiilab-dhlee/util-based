name: Frontend CI

on:
  push:
    tags:
      - "v*"
      - "dev*"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ===========================================
  # 공통: 환경 변수 설정
  # ===========================================
  setup:
    runs-on: ubuntu-latest
    outputs:
      env: ${{ steps.env.outputs.ENV }}
      version: ${{ steps.env.outputs.VERSION }}
      tag_version: ${{ steps.env.outputs.TAG_VERSION }}
      start_time: ${{ steps.start_time.outputs.START_TIME }}

    steps:
      - name: Record workflow start time
        id: start_time
        run: |
          echo "START_TIME=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Determine version and environment
        id: env
        run: |
          # 태그인지 브랜치인지 확인
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            # 태그 push
            TAG=${GITHUB_REF#refs/tags/}
            if [[ "$TAG" == dev* ]]; then
              ENV_NAME="dev"
              VERSION=${TAG#dev}
              TAG_VERSION="dev$VERSION"
            else
              ENV_NAME="prod"
              VERSION=${TAG#v}
              TAG_VERSION="v$VERSION"
            fi
          else
            # 브랜치 push (테스트용)
            ENV_NAME="test"
            VERSION="$(date +%Y%m%d-%H%M%S)"
            TAG_VERSION="test-$VERSION"
          fi

          echo "ENV=$ENV_NAME" >> $GITHUB_OUTPUT
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "TAG_VERSION=$TAG_VERSION" >> $GITHUB_OUTPUT
          echo "📋 Environment: $ENV_NAME, Version: $TAG_VERSION"

  # ===========================================
  # Job 1: Docker 이미지 빌드 및 푸시
  # ===========================================
  docker:
    needs: setup
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check GH_TOKEN secret
        run: |
          if [ -z "${{ secrets.GH_TOKEN }}" ]; then
            echo "❌ ERROR: GH_TOKEN secret is not set!"
            echo ""
            echo "The Docker build requires a GH_TOKEN repository secret to install private dependencies."
            echo ""
            echo "To fix this:"
            echo "1. Go to: https://github.com/${{ github.repository }}/settings/secrets/actions"
            echo "2. Create a new repository secret named 'GH_TOKEN'"
            echo "3. Set the value to a GitHub Personal Access Token with the following scopes:"
            echo "   - repo (for private repository access)"
            echo "   - read:packages (for private package access)"
            echo ""
            echo "For more information, see the README.md 'CI/CD 설정' section."
            exit 1
          fi
          echo "✅ GH_TOKEN secret is configured"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.setup.outputs.tag_version }}
            type=raw,value=${{ needs.setup.outputs.env }}-latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
          secrets: |
            github_token=${{ secrets.GH_TOKEN }}

  # ===========================================
  # Job 2: Deployment 레포지토리 업데이트 (CD)
  # ===========================================
  deploy:
    needs: [setup, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Clone deployment repository
        run: |
          if [[ "${{ needs.setup.outputs.env }}" == "dev" ]]; then
            DEPLOY_BRANCH="develop"
          else
            DEPLOY_BRANCH="main"
          fi
          echo "DEPLOY_BRANCH=$DEPLOY_BRANCH" >> $GITHUB_ENV

          if ! git clone --branch $DEPLOY_BRANCH --single-branch \
            https://x-access-token:${{ secrets.DEPLOY_TOKEN }}@github.com/xiilab/astrago-deployment-v2.git \
            deployment-repo; then
            echo "::error::Failed to clone deployment repository (branch: $DEPLOY_BRANCH)"
            exit 1
          fi

      - name: Update image tag in values.yaml
        uses: mikefarah/yq@v4.44.3
        with:
          cmd: yq -i '.frontend.image.tag = "${{ needs.setup.outputs.tag_version }}"' deployment-repo/dist/profiles/astrago_dev12/values/astrago-values.yaml

      - name: Commit and push changes
        run: |
          cd deployment-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet || {
            git commit -m "chore: update frontend image tag to ${{ needs.setup.outputs.tag_version }}"
            git push origin $DEPLOY_BRANCH
          }

  # ===========================================
  # Job 3: 릴리스 결과 요약 및 알림
  # ===========================================
  notify:
    needs: [setup, docker, deploy]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Calculate workflow duration
        id: duration
        uses: RockyIsHere/actions-calculate-log-time@v0.2.4
        with:
          start_time: ${{ needs.setup.outputs.start_time }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine CI status
        id: status
        run: |
          if [[ "${{ needs.docker.result }}" == "success" && "${{ needs.deploy.result }}" == "success" ]]; then
            echo "success=true" >> $GITHUB_OUTPUT
            echo "color=good" >> $GITHUB_OUTPUT
            echo "emoji=✅" >> $GITHUB_OUTPUT
            echo "status_text=성공" >> $GITHUB_OUTPUT
          else
            echo "success=false" >> $GITHUB_OUTPUT
            echo "color=danger" >> $GITHUB_OUTPUT
            echo "emoji=❌" >> $GITHUB_OUTPUT
            echo "status_text=실패" >> $GITHUB_OUTPUT
          fi

      - name: Generate CI/CD Summary
        run: |
          {
            echo "## 🚀 Frontend CI Summary"
            echo ""
            echo "### 환경: \`${{ needs.setup.outputs.env }}\`"
            echo "### 버전: \`${{ needs.setup.outputs.tag_version }}\`"
            echo "### 총 소요 시간: \`${{ steps.duration.outputs.duration }}\`"
            echo ""
            echo "| Job | 상태 |"
            echo "|-----|------|"
            echo "| 🐳 Docker Image | ${{ needs.docker.result == 'success' && '✅ 성공' || needs.docker.result == 'failure' && '❌ 실패' || '⏭️ 스킵' }} |"
            echo "| 🚀 Deploy | ${{ needs.deploy.result == 'success' && '✅ 성공' || needs.deploy.result == 'failure' && '❌ 실패' || '⏭️ 스킵' }} |"
            echo ""

            if [[ "${{ steps.status.outputs.success }}" == "true" ]]; then
              echo "### ✅ 이미지 빌드 완료"
              echo ""
              echo "Docker 이미지가 GitHub Packages에 성공적으로 푸시되었습니다."
              echo ""
              echo "**이미지 Pull 명령어:**"
              echo "\`\`\`bash"
              echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.setup.outputs.tag_version }}"
              echo "\`\`\`"
              echo ""
              echo "**GitHub Packages 확인:**"
              echo "- [\`https://github.com/${{ github.repository }}/pkgs/container/${{ github.event.repository.name }}\`](https://github.com/${{ github.repository }}/pkgs/container/${{ github.event.repository.name }})"
            else
              echo "### ⚠️ 이미지 빌드 실패"
              echo ""
              echo "Docker 이미지 빌드 중 오류가 발생했습니다."
              echo ""
              echo "> **주의**: 문제를 해결한 후 다시 태그를 푸시하세요."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Send Slack notification
        uses: slackapi/slack-github-action@v2.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "Astrago v2 Frontend CI ${{ steps.status.outputs.status_text }} (env=${{ needs.setup.outputs.env }}, version=${{ needs.setup.outputs.tag_version }}, duration=${{ steps.duration.outputs.duration }})",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "${{ steps.status.outputs.emoji }} Astrago v2 Frontend CI ${{ steps.status.outputs.status_text }}",
                    "emoji": true
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Environment:*\n`${{ needs.setup.outputs.env }}`"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Version:*\n`${{ needs.setup.outputs.tag_version }}`"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Duration:*\n`${{ steps.duration.outputs.duration }}`"
                    }
                  ]
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Docker 이미지 빌드 및 푸시:*\n${{ needs.docker.result == 'success' && '✅ 성공' || '❌ 실패' }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Deploy:*\n${{ needs.deploy.result == 'success' && '✅ 성공' || '❌ 실패' }}"
                    }
                  ]
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Registry:*\n`ghcr.io/${{ github.repository }}:${{ needs.setup.outputs.tag_version }}`"
                    }
                  ]
                },
                {
                  "type": "context",
                  "elements": [
                    {
                      "type": "mrkdwn",
                      "text": "<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|워크플로우 확인> | 트리거: ${{ github.actor }}"
                    }
                  ]
                }
              ]
            }

      - name: Fail if any job failed
        if: needs.docker.result == 'failure' || needs.deploy.result == 'failure'
        run: |
          echo "❌ CI failed: docker=${{ needs.docker.result }}, deploy=${{ needs.deploy.result }}"
          exit 1
